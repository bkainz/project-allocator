services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    environment:
      # Browser sees the app at port 80 now, so API calls go to /api
      API_URL: /api
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: package.json

  backend:
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    command: poetry run fastapi run --reload
    environment:
      PGUSER: pa_user
      PGPASSWORD: pa_pass
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: project-allocator-db-local
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /api/src
        - action: sync
          path: ./backend/migrations
          target: /api/migrations
        - action: rebuild
          path: pyproject.toml
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_DB: project-allocator-db-local
      POSTGRES_USER: pa_user
      POSTGRES_PASSWORD: pa_pass
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  caddy_data:
  caddy_config:
